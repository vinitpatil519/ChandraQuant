# SAV interpretation bands used by the narrative engine.
sav_bands:
  - {max: 24, label: "weak",       reading: "the rashi is structurally unsupported"}
  - {max: 28, label: "below par",  reading: "mild structural weakness"}
  - {max: 32, label: "average",    reading: "neutral structural support"}
  - {max: 36, label: "strong",     reading: "well supported, transits here tend to deliver"}
  - {max: 99, label: "very strong", reading: "maximum structural support - transits here are highly productive"}
