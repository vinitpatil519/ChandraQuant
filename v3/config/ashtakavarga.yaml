# Bhinnashtakavarga - the classical Parashari bindu (benefic point) tables.
#
# For each of the seven grahas, eight contributors (the 7 grahas + the Lagna) each
# donate a bindu to a specific set of houses counted FROM the contributor's own
# natal rashi. Summing all seven charts gives the Sarvashtakavarga (SAV), a 0-56
# score per rashi whose grand total across the zodiac is always 337.
#
# Usage in ChandraQuant: the SAV of the rashi currently occupied by each transiting
# graha becomes a continuous per-ticker strength feature. High SAV under a transiting
# benefic is a classical marker of a productive transit (Gochara).
#
# Verification invariants asserted in tests/test_ashtakavarga.py:
#   Surya 48, Chandra 49, Mangala 39, Budha 54, Guru 56, Shukra 52, Shani 39
#   grand total = 337

expected_totals:
  Surya: 48
  Chandra: 49
  Mangala: 39
  Budha: 54
  Guru: 56
  Shukra: 52
  Shani: 39
grand_total: 337

contributors: [Surya, Chandra, Mangala, Budha, Guru, Shukra, Shani, Lagna]

tables:
  Surya:
    Surya:   [1, 2, 4, 7, 8, 9, 10, 11]
    Chandra: [3, 6, 10, 11]
    Mangala: [1, 2, 4, 7, 8, 9, 10, 11]
    Budha:   [3, 5, 6, 9, 10, 11, 12]
    Guru:    [5, 6, 9, 11]
