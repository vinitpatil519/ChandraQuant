# 27 Nakshatras (lunar mansions) - each spans 13 deg 20 min of the sidereal zodiac.
# index: 0-based (0 = Ashwini, starting at 0 deg sidereal Mesha)
# lord:  Vimshottari dasha lord (cycle: Ketu Shukra Surya Chandra Mangala Rahu Guru Shani Budha)
# gana:  Deva (benevolent) / Manushya (human-neutral) / Rakshasa (obstructive)
# activity: classical karma-classification, mapped to market character
#   chara   = movable -> trending / directional
#   sthira  = fixed   -> range-bound / accumulation
#   ugra    = fierce  -> volatility expansion, destructive moves
#   mridu   = tender  -> gentle drift, low realised vol
#   kshipra = swift   -> fast resolution, quick reversals
#   tikshna = sharp   -> sharp spikes, stop-hunts
#   mishra  = mixed   -> whipsaw / indecision
# market_bias: prior in [-1, 1], used as a weak feature and for narrative colour
# archetype: one-line market reading consumed verbatim by the narrative engine

nakshatras:
  - index: 0
    name: Ashwini
    display: "Asvini"
    lord: Ketu
    deity: "Ashwini Kumaras"
    symbol: "Horse head"
    gana: Deva
    activity: kshipra
    market_bias: 0.35
    archetype: "swift initiation - fresh momentum lifting off a base"
  - index: 1
    name: Bharani
    display: "Bharani"
    lord: Shukra
    deity: Yama
    symbol: "Yoni"
    gana: Manushya
    activity: ugra
    market_bias: -0.30
    archetype: "forced transformation - capitulation and transfer of ownership"
