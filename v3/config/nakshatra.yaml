# Gandanta: the karmic knots at water-fire sign junctions. Last 3d20m of a water sign
# and first 3d20m of the following fire sign. Classical markers of structural instability.
gandanta_junctions:
  - {from_nak: Revati,   to_nak: Ashwini, note: "Meena to Mesha"}
  - {from_nak: Ashlesha, to_nak: Magha,   note: "Karka to Simha"}
  - {from_nak: Jyeshtha, to_nak: Mula,    note: "Vrischika to Dhanu"}
gandanta_orb_deg: 3.3333333

# Vimshottari dasha: the 120-year cycle
vimshottari:
  order: [Ketu, Shukra, Surya, Chandra, Mangala, Rahu, Guru, Shani, Budha]
  years:
    Ketu: 7
    Shukra: 20
    Surya: 6
    Chandra: 10
    Mangala: 7
    Rahu: 18
    Guru: 16
    Shani: 19
    Budha: 17
  total_years: 120

# Tarabala: the 9 taras counted from the natal Moon nakshatra.
# quality in [-1, 1] - classical auspiciousness, used directly as a feature.
tarabala:
  - {index: 1, name: Janma,    display: "Janma",     meaning: "birth star - self-referential, vulnerable", quality: -0.4}
  - {index: 2, name: Sampat,   display: "Sampat",    meaning: "wealth - gain and prosperity",              quality: 0.9}
  - {index: 3, name: Vipat,    display: "Vipat",     meaning: "danger - loss and accident",                quality: -0.9}
  - {index: 4, name: Kshema,   display: "Ksema",     meaning: "well-being - safety and consolidation",     quality: 0.7}
  - {index: 5, name: Pratyari, display: "Pratyari",  meaning: "obstacle - active opposition",              quality: -0.7}
  - {index: 6, name: Sadhaka,  display: "Sadhaka",   meaning: "accomplishment - goals realised",           quality: 0.8}
  - {index: 7, name: Vadha,    display: "Vadha",     meaning: "destruction - the most adverse tara",       quality: -1.0}
  - {index: 8, name: Mitra,    display: "Mitra",     meaning: "friend - supportive conditions",            quality: 0.6}
  - {index: 9, name: AtiMitra, display: "Ati-Mitra", meaning: "great friend - strongest support",          quality: 1.0}
