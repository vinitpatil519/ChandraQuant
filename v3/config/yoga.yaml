# 27 Nitya Yogas.
#   yoga_index = floor( ((sun_long + moon_long) mod 360) / (360/27) )  -> 0..26
# The nine classical inauspicious yogas (malefic: true) are the ones muhurta
# texts bar for new undertakings. They are the strongest single-flag risk
# markers in the panchanga and feed directly into the Bhaya (panic) composite.

yogas:
  - {index: 0,  name: Vishkambha, display: "Vishkambha", malefic: true,  meaning: "supported but obstructed - progress meets resistance",  market_bias: -0.35}
