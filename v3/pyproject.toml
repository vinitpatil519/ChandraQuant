[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chandraquant"
version = "3.0.0"
description = "Kala-Chakra Alpha Engine - natal-relative Jyotisha regime detection for Indian equity indices"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vinit Patil" }]
keywords = ["quantitative-finance", "jyotisha", "astronomy", "regime-detection", "nifty"]

# Only what is actually imported. The browser dashboard uses the standard library's
# http.server and inline SVG, so it needs no web framework or plotting stack.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "skyfield>=1.46",
    "yfinance>=0.2",
    "pyarrow>=14",          # parquet engine for the data and astro caches
    "pyyaml>=6",
    "joblib>=1.3",
    "rich>=13",
    "questionary>=2.0",
    "lightgbm>=4.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/vinitpatil519/ChandraQuant"

[project.scripts]
chandraquant = "chandraquant.cli.app:main"

[tool.setuptools.packages.find]
include = ["chandraquant*"]

[tool.setuptools.package-data]
chandraquant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
