[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chandraquant"
version = "3.0.0"
description = "Kala-Chakra Alpha Engine - natal-relative Jyotisha regime detection for Indian equity indices"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vinit Patil" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "skyfield>=1.46",
    "yfinance>=0.2",
    "pyarrow>=14",
    "pyyaml>=6",
    "joblib>=1.3",
    "rich>=13",
    "typer>=0.9",
    "questionary>=2.0",
    "textual>=0.50",
    "lightgbm>=4.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "plotly>=5.18"]
dev = ["pytest>=7", "shap>=0.44", "matplotlib>=3.8", "statsmodels>=0.14", "tabulate>=0.9"]

[project.scripts]
chandraquant = "chandraquant.cli.app:main"

[tool.setuptools.packages.find]
include = ["chandraquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
